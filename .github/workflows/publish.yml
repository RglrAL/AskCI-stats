# Publish the dashboard to GitHub Pages only when the data passes its checks: a failing check blocks the deploy
# and the last good version stays live (the cause is in the run's log).
# Cost exports are redacted before commit (tools/redact_costs.py, enforced by the local pre-commit hook). The workflow
# no longer redacts after the fact: a raw file committed here is already public in the history, so the deploy fails
# instead and the file has to be redacted and the commit removed (brief §108, handoff 9a).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the Ask bar test reads its frozen data from an earlier commit

      # Nothing that must not be public is in the tree (brief §108, handoff 9a-9b): every tracked cost export is
      # redacted and none sits at the repo root, analytics exports hold plain site addresses only, and the scan finds
      # no subscription ID, email address, IP address, local path or feed text column. Counts only, never the text.
      - name: Published files are clean
        run: |
          python3 tools/history_scan.py --head
          python3 tools/clean_ga4.py --check
          fail=0
          if git ls-files --error-unmatch costs.csv >/dev/null 2>&1; then echo "::error::costs.csv at the repo root: redact it locally and commit it to data/"; fail=1; fi
          for f in $(git ls-files '*.csv' | grep -i 'cost'); do
            if ! python3 tools/redact_costs.py "$f" --check >/dev/null 2>&1; then echo "::error::$f is not redacted: run tools/redact_costs.py on it locally"; fail=1; fi
          done
          exit $fail

      # Every file the dashboard reads has the columns it reads, and the files agree with each other
      # (the feed recount needs the feed, which never leaves the analyst's machine).
      - name: Audit the data files
        run: python3 tools/audit_data.py --files-only

      # Invented sentences with the class each rule should give them (brief §100); no feed is needed
      - name: Rule tests
        run: python3 tools/test_rules.py

      - name: Ask bar regression test
        run: python3 tools/test_ask.py

      # Markup planted in every data file must not run or become an element on any view (brief §108, handoff 9c)
      - name: Injection test
        run: python3 tools/test_inject.py

      # Copied figures carry the commit of the page and of the data that made them (footer of "Copy with definition");
      # the deployed commit is the cache key for the data files.
      - name: Stamp the page and data commits
        run: |
          PAGE=$(git log -1 --format=%h -- index.html)
          DATA=$(git log -1 --format=%h -- data)
          # build = the deployed commit: the page's cache key for every data file it fetches (brief §83)
          BUILD=$(git rev-parse --short HEAD)
          sed -i "s/content=\"page=local data=local\"/content=\"page=$PAGE data=$DATA build=$BUILD\"/" index.html
          grep -o 'askci-build" content="[^"]*"' index.html

      # The fact sheet for the last full month, answered by the page itself, published at reports/facts-latest.md.
      - name: Fact sheet
        run: python3 tools/make_facts.py

      # A change report for every confirmed model change, from the published files, at reports/change-<date>.md.
      - name: Change reports
        run: python3 tools/change_report.py --events

      # Incident candidates: error days against hours, response times and cost meters, at reports/incidents.md.
      - name: Incident candidates
        run: python3 tools/incidents.py

      # Findings and recommendations, each measurable item recomputed beside the figure brief §72 recorded, at reports/findings.md.
      - name: Findings
        run: python3 tools/make_findings.py

      # The phone service and centre extract (brief §106): answers naming them, by category, last full month
      - name: Handoff extract
        run: python3 tools/make_handoff.py

      # The content-gap register's evidence rows, rebuilt from the published files; the status file is never touched.
      - name: Content-gap register
        run: python3 tools/make_register.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
